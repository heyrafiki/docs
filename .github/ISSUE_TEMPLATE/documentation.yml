name: Documentation issue
description: Report an error or unclear instruction.
title: "Docs: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Link to the affected page.
      placeholder: https://docs.heyrafiki.space/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs attention?
      description: Describe the error, gap or unclear instruction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Suggested correction
      description: Include the source you used when the correction depends on an external fact.
