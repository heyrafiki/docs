name: Docs quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Mintlify CLI
        run: npm install --global mint@latest
      - name: Validate build
        run: mint validate
      - name: Check links
        run: mint broken-links --check-anchors --check-redirects
      - name: Check accessibility
        run: mint a11y
