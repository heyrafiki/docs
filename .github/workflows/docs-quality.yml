name: Documentation boundary

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docs-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate public contract
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate documentation boundary
        run: node scripts/check-docs.mjs

      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.41.2 lint openapi/heyrafiki.openapi.yaml
